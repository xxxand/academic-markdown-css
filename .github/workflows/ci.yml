name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Nothing here renders a PDF, so skip the Chromium download.
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax check
        run: for f in md-to-pdf*.js scripts/*.js scripts/*.mjs test/*.js; do node --check "$f"; done
      - run: npm run check:contrast
      - run: npm run test:unit
      - run: npm audit --audit-level=high
